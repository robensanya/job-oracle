<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Оракул трудоустройства</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4E0;--ink:#1B1B2F;--card:#fff;--mute:#1B1B2F99;--dot:#1B1B2F22;--pink:#FF4D8D;--blue:#3D5AFE;--yellow:#FFD23F;--lime:#B6F44A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15122B;--ink:#FFF4E0;--card:#221E40;--mute:#FFF4E0aa;--dot:#ffffff18}}
:root[data-theme="dark"]{--bg:#15122B;--ink:#FFF4E0;--card:#221E40;--mute:#FFF4E0aa;--dot:#ffffff18}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(var(--dot) 1.5px,transparent 1.6px) 0 0/22px 22px,var(--bg);color:var(--ink);font:400 16px/1.4 Onest,system-ui,sans-serif;overflow-x:hidden;position:relative}
body::before,body::after{content:"";position:absolute;z-index:0;border:3px solid var(--ink)}
body::before{width:150px;height:150px;border-radius:50%;background:var(--pink);top:-50px;left:-40px}
body::after{width:120px;height:120px;background:var(--lime);right:-30px;bottom:60px;transform:rotate(18deg);border-radius:24px}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:22px 20px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;min-height:100%;justify-content:center}
.tag{font:600 11px Unbounded,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:var(--lime);color:#1B1B2F;border:2px solid var(--ink);padding:6px 12px;border-radius:99px;transform:rotate(-2deg)}
h1{margin:0;font:800 clamp(30px,10vw,46px)/1.1 Onest,system-ui,sans-serif;letter-spacing:-.02em;text-wrap:balance}
h1 mark{display:inline-block;margin-top:6px;background:var(--yellow);color:#1B1B2F;padding:0 10px 3px;border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-1.5deg)}
svg{width:min(250px,70vw);height:auto;overflow:visible;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
#ballg{transform-origin:130px 180px}
#ballg.go{animation:wob .7s ease}
@keyframes wob{20%{transform:rotate(-7deg) scale(1.04)}45%{transform:rotate(6deg)}70%{transform:rotate(-3deg)}}
#eyes{transform-origin:130px 104px;animation:bl 5s infinite}
@keyframes bl{95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.55) rotate(45deg)}}
.card{width:100%;box-sizing:border-box;background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--pink);padding:18px 18px 16px;min-height:150px;display:flex;flex-direction:column;gap:10px;justify-content:center;text-align:left}
.card.pop{animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.94) rotate(-1deg);opacity:.2}}
.lbl{align-self:flex-start;font:600 11px Unbounded,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--blue);color:#fff;padding:4px 9px;border-radius:8px}
#txt{margin:0;font:600 18px/1.4 Onest,system-ui,sans-serif}
.meter{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}
.meter div{display:flex;justify-content:space-between;gap:10px}
.meter b{color:var(--ink);font-family:Unbounded,sans-serif}
.track{height:12px;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--lime);border-right:2px solid var(--ink);transition:width .6s ease}
button{width:100%;max-width:340px;font:800 16px Unbounded,sans-serif;background:var(--yellow);color:#1B1B2F;border:3px solid var(--ink);border-radius:16px;padding:16px 24px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,background .2s}
button:hover{background:var(--lime)}
button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
small{color:var(--mute);font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="tag">Бюро прогнозов · отдел кадров вселенной</div>
  <h1>Оракул <mark>трудоустройства</mark></h1>

  <svg id="art" viewBox="0 0 260 230" role="img" aria-label="Хрустальный шар с резюме и звёздочками">
    <g stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="130" cy="216" rx="80" ry="8" fill="var(--ink)" opacity=".15" stroke="none"/>
      <g transform="rotate(-12 60 120)">
        <rect x="18" y="66" width="80" height="102" rx="6" fill="var(--card)"/>
        <path d="M32 90h30M32 106h50M32 120h42M32 134h26" fill="none"/>
        <circle cx="86" cy="76" r="13" fill="var(--lime)"/>
        <path d="M80 77l4 4 8-9" fill="none"/>
      </g>
      <path d="M84 208h92l-14-36h-64z" fill="var(--pink)"/>
      <g id="ballg">
        <circle cx="130" cy="108" r="68" fill="var(--blue)"/>
        <path d="M84 84a52 52 0 0 1 32-30" fill="none" stroke="#fff" stroke-width="6"/>
        <g id="eyes" stroke="none" fill="#fff"><circle cx="108" cy="104" r="6"/><circle cx="152" cy="104" r="6"/></g>
        <path id="mouth" d="M110 130q20 14 40 0" fill="none" stroke="#fff" stroke-width="5"/>
      </g>
      <g transform="translate(214 44)"><path class="tw" fill="var(--yellow)" d="M0-16L5-5 16 0 5 5 0 16-5 5-16 0-5-5Z"/></g>
      <g transform="translate(228 150)"><path class="tw" style="animation-delay:-1s" fill="var(--pink)" d="M0-11L3-3 11 0 3 3 0 11-3 3-11 0-3-3Z"/></g>
      <circle cx="46" cy="30" r="7" fill="var(--yellow)"/>
    </g>
  </svg>

  <div class="card" id="card" aria-live="polite">
    <div class="lbl" id="lbl">Прогноз</div>
    <p id="txt">Нажми на кнопку, и оракул скажет, что думает про твои отклики.</p>
    <div class="meter" id="meter" hidden>
      <div><span>Вероятность исполнения</span><b id="pct"></b></div>
      <div class="track"><div class="fill" id="bar"></div></div>
      <span id="vrd"></span>
    </div>
  </div>

  <button id="go" type="button">Получить предсказание</button>
  <small id="foot"></small>
</main>

<script>
const A=["Сегодня","Завтра","Во вторник","В среду ближе к вечеру","На этой неделе","В пятницу в 17:59","Через две недели","До конца месяца","К зиме","Сразу после обеда","После полнолуния","Ночью","Скоро","Очень скоро","В ближайший четверг","В этом квартале","Однажды утром","Ровно через 9 дней"];
const B=[
"рекрутёр напишет «Добрый день!» и исчезнет с чувством выполненного долга.",
"тебе предложат тестовое на 6 часов «буквально на вечер».",
"«дружный коллектив» из вакансии окажется чатом на 400 человек.",
"придёт письмо «Мы вдохновлены вашим опытом». Вдохновение до оффера не дойдёт.",
"ты найдёшь вакансию мечты. Требуется 7 лет опыта в технологии трёх лет от роду.",
"HR назначит созвон на 15 минут, и он продлится 15 минут. Сенсация.",
"кто-то из знакомых скажет «у нас как раз открылась вакансия». Ещё не открылась, но скажет.",
"сопроводительное письмо получится тёплым, живым и абсолютно непрочитанным.",
"на собеседовании спросят, кем ты видишь себя через пять лет. Честный ответ: «в отпуске».",
"тебе позвонит незнакомый номер. Это не коллекторы, а рекрутёр. Почти наверняка.",
"LinkedIn сообщит, что твой профиль смотрели три человека. Двое из них боты, третий ты.",
"ты обновишь резюме, и оно впервые покажется тебе приличным.",
"работодатель пообещает обратную связь «в течение недели». Какой именно недели, не уточнит.",
"зарплатная вилка в объявлении окажется честной. Это почти мистика.",
"бот-рекрутёр напишет тебе, и это будет самый вежливый диалог за месяц.",
"твой отклик заметят. По ошибке, но заметят.",
"оффер придёт ровно тогда, когда ты перестанешь проверять почту каждые 4 минуты.",
"ты пройдёшь четыре этапа и узнаешь, что вакансию закрыли ради внутреннего кандидата.",
"на созвоне зависнет камера, и ты станешь самым запоминающимся кандидатом.",
"«динамичная среда» из описания расшифруется как «пожары по расписанию».",
"ты найдёшь баг в тестовом задании и тактично покажешь его. Тебя оценят.",
"рекрутёр скажет «мы вам перезвоним» и впервые сдержит слово.",
"тебя пригласят на «неформальную встречу», где всё формально, кроме кофе.",
"кто-то откликнется на твой пост «ищу работу», и это не будет МЛМ.",
"твоё портфолио откроют на телефоне, и оно, к счастью, адаптивное.",
"тебе предложат «гибкий график», то есть работать можно в любое время суток.",
"ты узнаешь, что компания мечты тоже кого-то ищет. Прямо сейчас.",
"HR спросит про ожидания по зарплате, и ты назовёшь цифру без нервного смеха.",
"в спаме найдётся письмо с приглашением на интервью. Спам иногда лучше инбокса.",
"ты допишешь резюме и поймёшь, что опыта у тебя больше, чем казалось.",
"знакомый знакомого оставит рекомендацию. Знакомый знакомого легенда.",
"нейросеть перепишет твоё резюме так, что ты сам захочешь себя нанять.",
"после третьего «к сожалению» придёт первое «с удовольствием».",
"работодатель оценит, что ты прочитал описание вакансии целиком. Редкий талант.",
"собеседование отменят за 10 минут, а потом вернут. Нервы тоже вернут, с процентами.",
"тебе скажут «вы нам подходите», и это даже будет правдой.",
"в офисе обнаружится кофемашина. Это уже половина удачного оффера.",
"ты откажешься от плохого оффера и впервые не почувствуешь вины.",
"бывший коллега напишет «слушай, у нас тут есть место».",
"тебе предложат стажировку «с перспективой». Перспектива будет в духе горизонта.",
"HR добавит тебя в «пул талантов». Бассейн, к счастью, тёплый.",
"в анкете попросят указать «увлечения». Ты наконец найдёшь слова, которые звучат не как «сериалы».",
"тебе ответят в течение часа. Придётся срочно вспомнить, куда ты откликался.",
"в офере будет написано «конкурентная зарплата». Конкурируют, видимо, между собой.",
"ты поймаешь себя на том, что объясняешь пробел в резюме с блеском стендап-комика.",
"на финальном этапе тебя спросят: «Вопросы есть?». Они будут, и очень хорошие."];
const C=["Это не точно, но звучит красиво.","Главное не отвечай в ту же секунду.","Сохрани скриншот на память.","Звёзды в курсе, но молчат.","Выдохни, это тоже часть процесса.","Купи себе за это что-нибудь вкусное.","Резюме при этом можно не трогать.","Не благодари, это бесплатно.","Хорошая новость: хуже уже было.","Плохая новость: придётся подождать.","Совпадение с реальностью случайно, но приятно.","Рекомендуем отметить чаем.","Дальше по ситуации.","Это знак. Или просто четверг.","Расскажи кому-нибудь, чтобы сбылось.","Тебя это точно касается.","Проверено на трёх кандидатах.","Скажи «ну надо же» и улыбнись.","Всё идёт по плану. Плана нет, но идёт.","Не гоняй себя, ты и так молодец.","Вселенная всё видит и ведёт переписку.","Подробности придут по почте. Проверь спам.","Это ещё не оффер, но уже сюжет.","Дыши ровно, пиши коротко.","Мы в тебя верим. Рекрутёры тоже, просто молча.","Заранее выбери рубашку для камеры.","Если не сработает, сработает что-то другое.","Маме пока можно не рассказывать.","Подтверждено лунным календарём и таблицей Excel.","Дальше будет интереснее."];
const S=[
"Скоро тебя найдёт вакансия, которую ты не искал. Она окажется неплохой.",
"Тебя ждёт оффер с зарплатой, при которой слово «вилка» не вызывает смеха.",
"В этом месяце три отказа превратятся в одно «да». Математика не врёт.",
"Твой следующий начальник читает те же мемы, что и ты. Совпадение случайно.",
"Новая работа начнётся с понедельника. Понедельники пока не отменены.",
"Скоро ты перестанешь бояться слова «испытательный срок» или хотя бы заменишь его на «пробную неделю».",
"Рекрутёр признается, что тоже не до конца понимает, чем занимается эта должность. Вы подружитесь.",
"Ты получишь оффер там, где совсем не ждал. Обычно так и бывает, просто об этом не пишут.",
"Тебе предложат работу мечты, но на шаг левее, чем мечталось. Шаг окажется удобным.",
"Одна из твоих отправленных анкет оживёт через полгода. Привет из прошлого!",
"Скоро ты скажешь «я подумаю» и впервые это будет не вежливым отказом.",
"Твой следующий офис будет с окнами. Это не шутка, это прогноз.",
"На собеседовании ты случайно скажешь что-то умное. Запомни, как это было.",
"Тебя возьмут не потому, что ты идеален, а потому что с тобой приятно. Лайфхак без лайфхаков.",
"Вселенная готовит тебе вакансию. Задержка из-за согласований.",
"Ты найдёшь работу, на которой не придётся делать вид, что любишь дедлайны.",
"Скоро в твоём календаре появится слово «оффер». Желательно с подчёркиванием красным от радости.",
"Рекрутёр, который однажды тебя проигнорировал, увидит твой профиль и тихо вздохнёт.",
"В течение месяца ты три раза услышишь «мы вам напишем». Один из них не соврёт.",
"Ты станешь тем самым кандидатом, о котором потом говорят: «Помнишь, мы его чуть не упустили?»",
"Тебе выпадет шанс отказаться от работы, которая тебе не нужна. Наслаждайся.",
"Грядёт неделя, когда всё сложится: резюме, письма, звонки. Правда, не помним, какая именно.",
"Скоро ты скажешь «да» и сам удивишься, как просто это было.",
"Твоё «спасибо за обратную связь» наконец-то будет искренним.",
"Через пару откликов тебя позовут туда, где нужен именно ты, со всеми странностями.",
"Пока ты тут нажимаешь кнопку, где-то открывается вакансия. Совпадение? Конечно.",
"На новой работе тебя спросят: «А что ты любишь делать?». Ответ окажется практически рабочим.",
"Тебя ждёт оффер, после которого резюме можно заархивировать с торжественной музыкой.",
"Всё будет хорошо. Подробности согласуем с отделом кадров вселенной.",
"Следующее «мы вам перезвоним» окажется звонком."];

const T=A.length*B.length*C.length+S.length;
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const labels=["Прогноз","Знак свыше","Оракул говорит","Из космоса","Срочно","Тайный прогноз","Шар видит"];
const mouths=["M110 130q20 14 40 0","M112 134q18 -6 36 0","M110 126q20 20 40 0","M114 132h32","M110 128q20 10 40 -4"];
const seen=[];
function make(){
  let t;
  for(let i=0;i<40;i++){
    t=Math.random()<.2?S[rnd(S.length)]:A[rnd(A.length)]+" "+B[rnd(B.length)]+" "+C[rnd(C.length)];
    if(!seen.includes(t))break;
  }
  seen.push(t);if(seen.length>60)seen.shift();
  return t;
}
function verdict(p){return p<15?"почти невозможно, но красиво":p<40?"шансы есть, как у лотереи":p<65?"как повезёт, но скорее да":p<85?"вполне вероятно":"практически бухгалтерия"}
$("foot").textContent="В базе "+T.toLocaleString("ru-RU")+" предсказаний. Совпадения с вашей реальностью случайны.";
$("go").addEventListener("click",()=>{
  const p=5+rnd(93);
  $("txt").textContent=make();
  $("lbl").textContent=labels[rnd(labels.length)];
  $("pct").textContent=p+"%";
  $("vrd").textContent=verdict(p);
  $("meter").hidden=false;
  $("bar").style.width="0";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$("bar").style.width=p+"%"}));
  $("mouth").setAttribute("d",mouths[rnd(mouths.length)]);
  const c=$("card"),b=$("ballg");
  c.classList.remove("pop");b.classList.remove("go");void c.offsetWidth;
  c.classList.add("pop");b.classList.add("go");
});
</script>
</body>
</html>
