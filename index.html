<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Оракул трудоустройства</title>
<meta name="theme-color" content="#f5f1e7">
<style>
:root {
  color-scheme: light dark;
  --paper: #f5f1e7; --ink: #27251f; --line: #938b7d; --accent: #93372b;
  --card: #fff9e9; --blue: #465c99; --pink: #c56a52; --yellow: #e6bd66; --lime: #bac5a0;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #232422; --ink: #f4eddc; --line: #827e70; --accent: #efa68d; --card: #413e37; }
}
* { box-sizing: border-box }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif }
main { width: min(960px, 90%); margin: clamp(24px, 8vh, 90px) auto 40px }
header { border-block: 1px solid var(--ink); padding: 9px 0; display: flex; justify-content: space-between; gap: 12px }
header, .folio { font: 12px/1.4 "Courier New", monospace; letter-spacing: .04em }
h1 { font-weight: 400; font-size: clamp(32px, 6.6vw, 84px); line-height: 1.06; letter-spacing: -.055em; margin: .32em 0 .4em }
.spread { display: grid; grid-template-columns: 38% 1fr; border-block: 1px solid var(--ink); padding: 26px 0; }
.figure { align-self: stretch; display: grid; place-items: center; border-right: 1px solid var(--line); padding: 12px 8% 20px 0 }
svg { display: block; width: min(100%, 300px); height: auto; overflow: visible }
.reading { padding: 10px 12px 12px clamp(24px, 5vw, 70px); display: flex; align-items: flex-start; flex-direction: column }
.folio { color: var(--accent); margin: 0 }
#txt { margin: .65em 0 1em; font-size: clamp(25px, 3vw, 36px); line-height: 1.2; letter-spacing: -.025em; min-height: 4.8em; text-wrap: pretty }
button { margin-top: auto; border: 0; padding: 12px 17px; background: var(--ink); color: var(--paper); font: 600 15px/1.4 system-ui, sans-serif; cursor: pointer }
button:hover { background: var(--accent) }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px }
button span { margin-left: .8em }
@media (max-width: 620px) {
  main { margin-top: 20px }
  header { font-size: 11px }
  .spread { grid-template-columns: 1fr; padding: 0 0 24px }
  .figure { border-right: 0; padding: 8px 0 16px }
  svg { width: min(48vw, 185px) }
  .reading { border-top: 1px dotted var(--line); padding: 20px 0 0 }
}
#ballg{transform-origin:130px 180px}
#ballg.go{animation:wob .7s ease}
@keyframes wob{20%{transform:rotate(-7deg) scale(1.04)}45%{transform:rotate(6deg)}70%{transform:rotate(-3deg)}}
#eyes{transform-origin:130px 104px;animation:bl 5s infinite}
@keyframes bl{95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.55) rotate(45deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
</head>
<body>
<main>
  <header><span>Бюро прогнозов</span><span>Труд и карьера</span></header>
  <h1>Оракул трудоустройства</h1>
  <div class="spread">
    <div class="figure">
  <svg id="art" viewBox="0 0 260 230" role="img" aria-label="Хрустальный шар с резюме и звёздочками">
    <g stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="130" cy="216" rx="80" ry="8" fill="var(--ink)" opacity=".15" stroke="none"/>
      <g transform="rotate(-12 60 120)">
        <rect x="18" y="66" width="80" height="102" rx="6" fill="var(--card)"/>
        <path d="M32 90h30M32 106h50M32 120h42M32 134h26" fill="none"/>
        <circle cx="86" cy="76" r="13" fill="var(--lime)"/>
        <path d="M80 77l4 4 8-9" fill="none"/>
      </g>
      <path d="M84 208h92l-14-36h-64z" fill="var(--pink)"/>
      <g id="ballg">
        <circle cx="130" cy="108" r="68" fill="var(--blue)"/>
        <path d="M84 84a52 52 0 0 1 32-30" fill="none" stroke="#fff" stroke-width="6"/>
        <g id="eyes" stroke="none" fill="#fff"><circle cx="108" cy="104" r="6"/><circle cx="152" cy="104" r="6"/></g>
        <path id="mouth" d="M110 130q20 14 40 0" fill="none" stroke="#fff" stroke-width="5"/>
      </g>
      <g transform="translate(214 44)"><path class="tw" fill="var(--yellow)" d="M0-16L5-5 16 0 5 5 0 16-5 5-16 0-5-5Z"/></g>
      <g transform="translate(228 150)"><path class="tw" style="animation-delay:-1s" fill="var(--pink)" d="M0-11L3-3 11 0 3 3 0 11-3 3-11 0-3-3Z"/></g>
      <circle cx="46" cy="30" r="7" fill="var(--yellow)"/>
    </g>
  </svg>
    </div>
    <div class="reading">
      <div aria-live="polite" aria-atomic="true">
        <p class="folio" id="folio">На приёме у оракула</p>
        <p id="txt">Что там с работой?</p>
      </div>
      <button id="go" type="button"><b id="action">Спросить шар</b><span aria-hidden="true">↗</span></button>
    </div>
  </div>
</main>
<script>
const forecasts = [
  'На собеседовании попросят показать любимый проект. Ты откроешь его на той самой странице, которую обычно все пролистывают. «Подождите, а как вы это сделали?»',
  'Бывшая коллега пришлёт скрин вакансии. Под ним будет второе сообщение, поважнее: «Я уже дала им твой контакт».',
  'В пятницу в 17:58 придёт письмо «Есть минутка?». Внутри окажется оффер в PDF. Минутка найдётся.',
  'В вакансии будет написано «чувство юмора обязательно». На вопрос, что случилось с предыдущим сотрудником, ответят: «Он теперь вас собеседует».',
  'Ты спросишь, как выглядит обычный вторник в команде. Руководитель откроет календарь и скажет: «Вот этот созвон я, пожалуй, прямо сейчас отменю».',
  'Письмо начнётся со слов «К сожалению». Дочитай. К сожалению, переговорка занята, поэтому познакомиться предлагают в кофейне этажом ниже.',
  'Посреди собеседования в кадр войдёт собака. С той стороны позовут свою. Первые четыре минуты встречи в протокол не попадут.',
  'Компания попросит контакты для рекомендаций. Через час бывший руководитель напишет: «Я им всё рассказал». Ещё через минуту: «Хорошее, господи».',
  'Тебе дадут выбрать время встречи. В календаре найдётся слот после обеда, в котором ты уже умеешь разговаривать с людьми.',
  'На вопрос о зарплате ты назовёшь сумму и потянешься за водой. Пока пьёшь, с той стороны успеют сказать «да».',
  'В канале с вакансиями попадётся объявление на три строки. Третья будет с зарплатой. Ты даже вернёшься к первой, чтобы прочитать, кем работать.',
  'К тестовому приложат образец готовой работы. По комментариям на полях ты поймёшь про будущего начальника больше, чем за два интервью.',
  'Твоё резюме откроют из папки «На будущее». Оказывается, у будущего есть дата выхода и бюджет на ставку.',
  'На финале разговор зайдёт о том, с кем тебе предстоит работать. Руководитель махнёт рукой за кадром. В кадр въедет на стуле Оля и расскажет всё гораздо понятнее.',
  'Придёт отказ с толковой обратной связью. Последний абзац ты перешлёшь подруге со словами: «Так, оказывается, можно было».',
  'На собеседовании спросят, какой проект не получился. Ты расскажешь, где всё пошло наперекосяк. Будущий коллега откроет блокнот: «А можно чуть медленнее? У нас сейчас ровно это».',
  'В письме с темой «Уточнение» окажется пересмотренная сумма. Ты дважды сверишь цифры со старым письмом. Потом откроешь калькулятор. Всё верно.',
  'Найдётся вакансия, которую ты ни за что не увидишь по названию. Настоящее название обнаружится внутри: ровно так ты уже три года объясняешь друзьям свою работу.',
  'Кто-то сохранит твой пост про поиск работы и вспомнит о нём на планёрке. До тебя эта история дойдёт в пересказе на первом рабочем обеде.',
  'На первом созвоне тебе покажут рабочий чат. Последнее сообщение там будет «я завтра к стоматологу». Под ним три сердечка, ни одного вопроса.',
  'Ты закроешь вкладку с анкетой на восемь страниц. Через полчаса отправишь один короткий отклик туда, где давно хотелось работать. Именно его и откроют утром.',
  'В оффере будет строка, которую захочется уточнить. Ты задашь вопрос. В ответ пришлют исправленный файл, и строка наконец будет значить ровно то, что в ней написано.',
  'Один из собеседников принесёт на встречу распечатку твоего портфолио. На полях обнаружатся карандашные пометки. Тебе давно хотелось, чтобы кто-нибудь спросил именно об этом.',
  'В первый рабочий день тебя добавят в чат «Обеды». Через полчаса ты будешь знать, у кого запасная зарядка, где приличный кофе и кому на самом деле писать про доступы.'
];

const button = document.getElementById('go');
const ball = document.getElementById('ballg');
const mouth = document.getElementById('mouth');
const expressions = ['M110 130q20 14 40 0', 'M112 130q17 8 34 -2', 'M112 128q18 18 36 0'];
let deck = [];
let previous;
let issue = 0;

function draw() {
  if (deck.length === 0) {
    deck = [...forecasts];
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    const last = deck.length - 1;
    if (deck[last] === previous) {
      [deck[0], deck[last]] = [deck[last], deck[0]];
    }
  }
  previous = deck.pop();
  return previous;
}

button.addEventListener('click', () => {
  issue++;
  document.getElementById('folio').textContent = 'Прогноз № ' + String(issue).padStart(2, '0');
  document.getElementById('txt').textContent = draw();
  document.getElementById('action').textContent = 'Ещё прогноз';
  mouth.setAttribute('d', expressions[issue % expressions.length]);
  ball.classList.remove('go');
  void ball.getBoundingClientRect();
  ball.classList.add('go');
});
</script>
</body>
</html>
